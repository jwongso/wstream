<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wstream ASR - WebAssembly Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎤 wstream ASR</h1>
            <p>Real-time Speech Recognition in Your Browser</p>
        </header>

        <div class="status-card">
            <div class="status-indicator" id="statusIndicator"></div>
            <span id="statusText">Initializing...</span>
        </div>

        <div class="controls">
            <button id="initBtn" class="btn btn-primary">Initialize Model</button>
            <button id="startBtn" class="btn btn-success" disabled>Start Recording</button>
            <button id="stopBtn" class="btn btn-danger" disabled>Stop Recording</button>
        </div>

        <div class="model-selector">
            <label for="modelSelect">Model:</label>
            <select id="modelSelect">
                <option value="models/ggml-tiny.en.bin">Tiny (39 MB)</option>
                <option value="models/ggml-tiny.en-q5_1.bin">Tiny Q5_1 (31 MB)</option>
                <option value="models/ggml-base.en.bin">Base (142 MB)</option>
                <option value="models/ggml-base.en-q5_1.bin" selected>Base Q5_1 (57 MB)</option>
            </select>
        </div>

        <div class="transcription-container">
            <div class="transcription-header">
                <h2>Transcription</h2>
                <button id="clearBtn" class="btn btn-secondary">Clear</button>
            </div>
            <div id="transcription" class="transcription-box"></div>
            <div class="transcription-options">
                <label class="checkbox-label">
                    <input type="checkbox" id="showMetrics" checked>
                    <span>Show Metrics</span>
                </label>
                <div class="confidence-filter">
                    <label for="confidenceFilter">Min Confidence:</label>
                    <input type="number"
                        id="confidenceFilter"
                        min="0"
                        max="100"
                        step="5"
                        value="0"
                        title="Only show transcriptions with confidence above this value">
                    <span class="confidence-filter-hint">
                        <span id="confidenceFilterValue">0</span>%
                    </span>
                </div>
            </div>
        </div>

        <div class="info">
            <p>💡 Click "Initialize Model" first, then "Start Recording" to begin.</p>
            <p>⚡ Powered by Whisper.cpp and WebAssembly</p>
        </div>
    </div>

    <!-- Load WASM module -->
    <script src="wstream_wasm.js"></script>

    <!-- Load application -->
    <script src="wstream.js"></script>
</body>
</html>
